<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#17554d"><title>地理練習室｜第 3–4 課精熟練習</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="brand" href="#" id="home"><span class="brand-icon">◎</span><span>地理練習室<small>GEOGRAPHY PRACTICE</small></span></a><span class="header-tag">二上地理 · 第 3–4 課</span><button id="profile" class="quiet">我的進度</button></header>
<main id="app"></main>
<footer>原題取自你提供的學生版練習本 · 進度儲存於此瀏覽器，不會跨裝置同步</footer>
<dialog id="viewer"><div class="dialog-head"><b id="viewer-title">原稿檢視</b><button id="close-viewer" class="quiet">關閉 ✕</button></div><div class="zoom-body"><img id="zoom-image" alt="練習本原稿放大圖"></div></dialog>
<dialog id="profile-dialog"><h2>為自己保留進度</h2><p>輸入暱稱。同一台裝置上的學生可以使用不同暱稱。</p><label for="nickname">學生暱稱</label><input id="nickname" maxlength="30" autocomplete="off" placeholder="例如：小地理"><p class="muted">相同暱稱會接續原本的紀錄。清除瀏覽器資料會移除進度。</p><div class="dialog-actions"><button id="cancel-profile" class="quiet">取消</button><button id="save-profile" class="primary">儲存並切換</button></div></dialog>
<script src="questions.js"></script><script src="app.js"></script>
</body></html>
