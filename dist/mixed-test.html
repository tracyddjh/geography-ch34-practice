<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17554d"><title>地理2上 L3–4練習本混合測驗（南一）</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="mixed-test.css"></head><body>
<header><a class="brand" href="mixed-test.html">地理2上 L3–4練習本混合測驗（南一）</a><span>獨立計分 · 總分100分</span></header>
<main><section class="mixed-intro"><p class="eyebrow">第3–4課 · 獨立混合測驗</p><h1>20題，檢查你的學習成果。</h1><p>第3課「中國的產業轉型與區域差異」與第4課「全球化下的中國」各10題，原題與圖片不變，題序隨機。</p><p><strong>每題5分，總分100分。</strong>填寫學生資料後即可作答，不必先完成精熟練習。本測驗不影響精熟進度或闖關資格。</p></section>
<section id="identity-panel" class="mixed-card"><h2>填寫學生資料</h2><form id="mixed-identity"><div class="student-fields"><label>班級<input id="mixed-class" maxlength="40" required placeholder="例如：802"></label><label>座號<input id="mixed-seat" type="number" min="1" max="999" step="1" required></label><label>姓名<input id="mixed-name" maxlength="40" required autocomplete="off"></label></div><p id="identity-message" role="status"></p><button class="primary" type="submit">確認資料，開始測驗 →</button></form></section>
<section id="mixed-work" hidden><div class="mixed-toolbar"><b id="student-label"></b><span id="mixed-progress" aria-live="polite"></span></div><progress id="answer-progress" max="20" value="0" aria-label="已作答題數"></progress><nav id="question-nav" aria-label="測驗題目導覽"></nav><div id="mixed-result" role="status"></div><article id="mixed-question" class="mixed-card"></article><div class="mixed-controls"><button id="mixed-prev">← 上一題</button><button id="mixed-next">下一題 →</button></div><p id="submit-message" role="status"></p><button id="mixed-submit" class="primary">交卷並計分</button><p class="mixed-report-note">交卷後會回傳班級、座號、姓名與作答成績。請等畫面顯示「已回傳老師」再關閉。</p></section>
</main><footer>獨立混合測驗 · 重新整理可接續本分頁作答 · 交卷前可修改答案</footer><dialog id="mixed-viewer"><div class="dialog-head"><b>練習本原題放大圖</b><button id="mixed-close">關閉 ✕</button></div><div class="zoom-body"><img id="mixed-image" alt="練習本原題放大圖"></div></dialog><script src="questions.js"></script><script src="config.js"></script><script src="mixed-test-reporting.js?v=1"></script><script src="mixed-test.js?v=report2"></script></body></html>
